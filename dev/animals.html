<!doctype html>
<html>
<head><meta charset="utf-8"><title>Animals</title>
<style>
  html,body{margin:0;background:#cfe9f7;font-family:sans-serif}
  #grid{display:grid;gap:2px}
  figure{margin:0;position:relative;aspect-ratio:1}
  figcaption{position:absolute;left:4px;top:2px;font-size:12px;color:#123;z-index:1}
  #c{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
</style></head>
<body>
<!-- Every breed in src/three/animals/chicken.js, close up in the game's light and from its camera, pecking now and
     then; ?set=buffaloes shows the buffaloes in src/three/animals/buffalo.js instead, grazing (?walk=1, walking on
     the spot), ?set=cows two cows from src/three/animals/cow.js, their patches laid out differently, ?set=sheep
     two ewes from src/three/animals/sheep.js, ?set=pigs the pig in src/three/animals/pig.js, ?set=ducks and
     ?set=birds the ducks and the swallow in src/three/animals/duck.js and birds.js, ?set=robins the robin in
     src/three/animals/robin.js, turned every way it may be placed (each cell its own turn). ?cols=4 sets the grid width,
     ?turn=0 turns them all to face the camera (1.1 by default), ?t=10 holds them at that moment, ?view=0.8 looks
     closer. -->
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { chicken, CHICKENS } from '../src/three/animals/chicken.js';
import { buffalo, BUFFALOES } from '../src/three/animals/buffalo.js';
import { cow } from '../src/three/animals/cow.js';
import { sheep } from '../src/three/animals/sheep.js';
import { pig, PIGS } from '../src/three/animals/pig.js';
import { duck, DUCKS } from '../src/three/animals/duck.js';
import { bird, BIRDS } from '../src/three/animals/birds.js';
import { robin } from '../src/three/animals/robin.js';

// The game's sun (SUN_DIR in countryside.js).
const SUN_DIR = new THREE.Vector3(-0.414, 1.11, 0.91).normalize();
const params = new URLSearchParams(location.search);
const cols = Number(params.get('cols') || 4);
const turn = Number(params.get('turn') ?? 1.1);
const still = params.has('t') ? Number(params.get('t')) : null;
// ?walk=1 has the buffaloes, cows and sheep walk on the spot.
const walking = params.has('walk');

// Each set: its kinds, how to make one, how many world units a cell shows across, and how it moves.
const SETS = {
  chickens: { kinds: CHICKENS, make: chicken, view: 0.44, move: (a, t, phase) => (a.userData.head.rotation.x = 0.95 * Math.max(0, Math.sin(t * 3 + phase)) ** 4) },
  buffaloes: { kinds: BUFFALOES, make: (name) => buffalo(name), view: 1.6, move: (a, t, phase) => a.userData.update(t + phase, 1 / 60, walking ? 0.12 : 0) },
  // Two Holsteins, each with the phase that lays out its patches.
  cows: { kinds: { holstein: 0, 'holstein 2': 5.3 }, make: (name) => cow('holstein', SETS.cows.kinds[name]), view: 1.6, move: (a, t, phase) => a.userData.update(t + phase, 1 / 60, walking ? 0.12 : 0) },
  // Two ewes, each with the phase that lays out its fleece.
  sheep: { kinds: { ewe: 0, 'ewe 2': 5.3 }, make: (name) => sheep('ewe', SETS.sheep.kinds[name]), view: 1.0, move: (a, t, phase) => a.userData.update(t + phase, 1 / 60, walking ? 0.12 : 0) },
  pigs: { kinds: PIGS, make: (name) => pig(name), view: 0.8, move: (a, t, phase) => a.userData.update(t + phase, 1 / 60, walking ? 0.1 : 0) },
  ducks: { kinds: DUCKS, make: duck, view: 0.4, move: (a, t, phase) => (a.userData.head.rotation.x = 0.12 * Math.sin(t * 5 + phase)) },
  // A swallow in the air, beating its wings for three seconds, then gliding for three; ?t holds its wings at a
  // moment of their beat, a second a beat.
  birds: { kinds: BIRDS, make: (name) => {
    const b = bird(name);
    b.position.y = 0.3;
    return b;
  }, view: 1.0, move: (a, t, phase) => a.userData.flap(t * (still === null ? 14 : 1) + phase, (t + phase) % 6 > 3 ? 1 : 0) },
  // The robin as it sits on the post (1.4 times its size), each cell turned its own way from facing the camera, as it
  // may be placed: the names are those turns, ?turn is not used.
  robins: { kinds: { 'quay phải': Math.PI / 2, 'chếch phải': 0.8, 'nhìn thẳng': 0, 'chếch trái': -0.8, 'quay trái': -Math.PI / 2, 'quay lưng chếch trái': -2.3, 'quay lưng': Math.PI, 'quay lưng chếch phải': 2.3 }, make: (name) => {
    const g = new THREE.Group();
    const r = robin(1.4);
    r.rotation.y = SETS.robins.kinds[name] - turn;
    g.add(r);
    g.userData.update = r.userData.update;
    return g;
  }, view: 0.4, move: (a, t, phase) => a.userData.update(t + phase) },
};
const set = SETS[params.get('set') || 'chickens'];

const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
const cells = Object.keys(set.kinds).map((name) => {
  const f = document.createElement('figure');
  const cap = document.createElement('figcaption');
  cap.textContent = name;
  f.append(cap);
  grid.append(f);
  const animal = set.make(name);
  animal.rotation.y = Math.PI / 4 + turn;
  return { f, animal, phase: Math.random() * 6 };
});

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setScissorTest(true);
renderer.setClearColor('#cfe9f7');
renderer.shadowMap.enabled = true;

// The game's lights (see FarmScene).
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#e4eeff', '#7b9a4a', 0.8));
const sun = new THREE.DirectionalLight('#ffe2a4', 3.2);
sun.position.copy(SUN_DIR).multiplyScalar(4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
// ?view=0.8 shows that many world units across a cell, to look closer.
const v = Number(params.get('view') || set.view);
Object.assign(sun.shadow.camera, { left: -v, right: v, top: v, bottom: -v, near: 0.5, far: 8 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(v * 0.7, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#d9b77e', roughness: 0.95 }));
ground.receiveShadow = true;
scene.add(ground);
// The game's camera direction, close up.
const mid = set.view * 0.18;
const camera = new THREE.OrthographicCamera(-v / 2, v / 2, v / 2 + mid, -v / 2 + mid, 0.1, 100);
camera.position.copy(new THREE.Vector3(1, 0.95, 1).normalize().multiplyScalar(10));
camera.lookAt(0, mid, 0);

const clock = new THREE.Timer();
renderer.setAnimationLoop(() => {
  clock.update();
  const t = still ?? clock.getElapsed();
  for (const { f, animal, phase } of cells) {
    set.move(animal, t, still === null ? phase : 0);
    scene.add(animal);
    const r = f.getBoundingClientRect();
    const y = window.innerHeight - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height);
    renderer.setScissor(r.left, y, r.width, r.height);
    renderer.render(scene, camera);
    scene.remove(animal);
  }
  window.__ready = true;
});
</script>
</body></html>

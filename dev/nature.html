<!doctype html>
<html>
<head><meta charset="utf-8"><title>Nature models</title>
<style>
  html,body{margin:0;background:#cfe9f7;font-family:sans-serif}
  #grid{display:grid;gap:2px}
  figure{margin:0;position:relative;aspect-ratio:1}
  figcaption{position:absolute;left:4px;top:2px;font-size:10px;color:#123;z-index:1}
  #c{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
</style></head>
<body>
<!-- The models in src/three/natureModels.js, in the game's light and colours; `node dev/nature-models.cjs <folder> all`
     puts in the whole pack to compare. ?pack shows the pack's own colours, ?only=ROCK_01_Small,TREE_14_Stump picks
     models (or ?only=ROCK_ for every rock), ?cols=10 sets the grid width. -->
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { natureGeometry, natureSize } from '../src/three/nature.js';
import { NATURE_MODELS } from '../src/three/natureModels.js';

// The pack's own colours, as dev/nature-models.cjs prints them.
const PACK_COLORS = {
  BarkLight: '#8a6748', CutWood: '#c7a273', Moss: '#799052', Bark: '#765237', Seed: '#8e5f35', Rock: '#99a29e',
  RockLight: '#b1b5ac', RockDark: '#849090', Leaf: '#61935b', Grass: '#81a255', White: '#f0efd7', Yellow: '#e7bc4d',
  Purple: '#a679b5', Blue: '#6fa0bf', BarkDark: '#5b3c2c', Red: '#c86148', Dirt: '#846a4f', Mud: '#695745',
  DirtLight: '#8f7759', Sand: '#cbb693', LeafDark: '#426e4d', LeafLight: '#84a863', GrassLight: '#aab86f',
  WetRock: '#657c7c', Water: '#4b908e', Foam: '#d4e8dd', MushStem: '#d4c8a4', MushGill: '#ac9e84', MushBrown: '#a27957',
  LeafFresh: '#9eb569', Wood: '#9e7952', WoodLight: '#b89365', Rope: '#b5a481', Metal: '#596965', Weathered: '#90907e',
  Ember: '#b3481d', Lantern: '#f3bd65', PineDark: '#355f52', Pine: '#488465', PineLight: '#699973', Birch: '#dee1d4',
  BirchScar: '#6c766f', HeartWood: '#a07952', WaterDeep: '#356f79',
};

const params = new URLSearchParams(location.search);
const colors = params.has('pack') ? PACK_COLORS : {};
const only = params.get('only') ? params.get('only').split(',') : null;
const names = Object.keys(NATURE_MODELS).filter((n) => !only || only.some((o) => n.startsWith(o)));
const cols = Number(params.get('cols') || 10);
const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
const cells = names.map((name) => {
  const f = document.createElement('figure');
  const g = natureGeometry(name, 1, colors);
  const size = natureSize(name);
  const cap = document.createElement('figcaption');
  cap.textContent = `${name.replace(/^[A-Z]+_/, '')} · ${size.width.toFixed(1)}×${size.height.toFixed(1)}×${size.depth.toFixed(1)}m · ${g.attributes.position.count / 3}▲`;
  f.append(cap);
  grid.append(f);
  return { f, g, size };
});

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setScissorTest(true);
renderer.setClearColor('#cfe9f7');

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#fff6dc', '#86a85a', 1.2));
const sun = new THREE.DirectionalLight('#fff0c4', 2.4);
sun.position.set(3.5, 9, -1.2);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#93da68', roughness: 0.95 }));
scene.add(ground);
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, flatShading: true });
const model = new THREE.Mesh(undefined, mat);
scene.add(model);
// The game's camera direction.
const camera = new THREE.OrthographicCamera(-1, 1, 1.1, -0.9, 0.1, 100);
camera.position.copy(new THREE.Vector3(1, 0.95, 1).normalize().multiplyScalar(20));
camera.lookAt(0, 0.3, 0);

for (const { f, g, size } of cells) {
  const r = f.getBoundingClientRect();
  const y = window.innerHeight - r.bottom;
  renderer.setViewport(r.left, y, r.width, r.height);
  renderer.setScissor(r.left, y, r.width, r.height);
  model.geometry = g;
  // Fit the cell.
  model.scale.setScalar(1.5 / Math.max(size.width, size.depth, size.height * 1.3));
  renderer.render(scene, camera);
}
window.__ready = true;
</script>
</body></html>

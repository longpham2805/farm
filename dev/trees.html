<!doctype html>
<html>
<head><meta charset="utf-8"><title>Trees</title>
<style>
  html,body{margin:0;background:#cfe9f7;font-family:sans-serif}
  #grid{display:grid;gap:2px}
  figure{margin:0;position:relative;aspect-ratio:3/4}
  figcaption{position:absolute;left:4px;top:2px;font-size:11px;color:#123;z-index:1}
  #c{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
</style></head>
<body>
<!-- The trees from src/three/trees.js in the game's light, each kind from a few seeds; ?cols=6 sets the grid width,
     ?seeds=1,2,3 picks the seeds. -->
<div id="grid"></div>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { pineTree, roundTree, birchTree, bush, fruitSpots, BLOSSOM } from '../src/three/trees.js';
import { seeded } from '../src/util.js';

// The game's sun (SUN_DIR in countryside.js, which this page leaves out so as not to build the whole valley).
const SUN_DIR = new THREE.Vector3(-0.414, 1.11, 0.91).normalize();

const params = new URLSearchParams(location.search);
const seeds = (params.get('seeds') || '1,2,3,4').split(',').map(Number);
const cols = Number(params.get('cols') || 6);
const kinds = [
  ['pine', (s) => pineTree(s, 1.6)],
  ['round', (s) => roundTree(s, 1.5)],
  ['fruit', (s) => roundTree(s, 1.2)],
  ['blossom', (s) => roundTree(s, 1.6, BLOSSOM)],
  ['birch', (s) => birchTree(s, 1.8)],
  ['bush', (s) => bush(s)],
];
const grid = document.getElementById('grid');
grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
const cells = [];
for (const seed of seeds) {
  for (const [kind, make] of kinds) {
    const tree = make(seed);
    const f = document.createElement('figure');
    const cap = document.createElement('figcaption');
    cap.textContent = `${kind} ${seed} · ${tree.geometry.attributes.position.count / 3}▲`;
    f.append(cap);
    grid.append(f);
    cells.push({ f, kind, tree });
  }
}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setScissorTest(true);
renderer.setClearColor('#cfe9f7');
renderer.shadowMap.enabled = true;

// The game's lights (see FarmScene).
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#e4eeff', '#7b9a4a', 0.8));
const sun = new THREE.DirectionalLight('#ffe2a4', 3.2);
sun.position.copy(SUN_DIR).multiplyScalar(6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: 0.5, far: 12 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(0.85, 32).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#8ad25a', roughness: 0.95 }));
ground.receiveShadow = true;
scene.add(ground);
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85 });
const model = new THREE.Mesh(undefined, mat);
model.castShadow = true;
model.receiveShadow = true;
scene.add(model);
const fruits = new THREE.Group();
scene.add(fruits);
const fruitMat = new THREE.MeshStandardMaterial({ color: '#ffa53a', roughness: 0.6 });
const ball = new THREE.SphereGeometry(0.055, 10, 7);
// The game's camera direction.
const camera = new THREE.OrthographicCamera(-0.8, 0.8, 1.3, -0.85, 0.1, 100);
camera.position.copy(new THREE.Vector3(1, 0.95, 1).normalize().multiplyScalar(20));
camera.lookAt(0, 0.45, 0);

for (const { f, kind, tree } of cells) {
  const r = f.getBoundingClientRect();
  const y = window.innerHeight - r.bottom;
  renderer.setViewport(r.left, y, r.width, r.height);
  renderer.setScissor(r.left, y, r.width, r.height);
  model.geometry = tree.geometry;
  fruits.clear();
  if (kind === 'fruit') {
    // Unturned, a tree's +z side faces the camera.
    for (const [p] of fruitSpots(tree.puffs, 7, seeded(5), Math.PI / 2)) {
      const m = new THREE.Mesh(ball, fruitMat);
      m.position.copy(p);
      fruits.add(m);
    }
  }
  renderer.render(scene, camera);
}
window.__ready = true;
</script>
</body></html>

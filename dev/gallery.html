<!doctype html>
<html>
<head><meta charset="utf-8"><title>Gallery</title>
<style>
  html,body{margin:0;height:100%;background:#222;font-family:sans-serif;color:#fff}
  #c{width:100vw;height:100vh;display:block}
  #thumbs{position:absolute;inset:0;display:none;flex-wrap:wrap;gap:4px;padding:8px;background:#f6efe2;overflow:auto;align-content:flex-start}
  #thumbs figure{margin:0;width:96px;text-align:center;color:#333;font-size:10px}
  #thumbs img{width:96px;height:96px;background:#fff3;border-radius:8px}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="thumbs"></div>
<script type="module">
import { FarmScene } from '../src/three/scene.js';
import { CROPS } from '../src/data/crops.js';
import { cropImg } from '../src/three/thumbs.js';
const params = new URLSearchParams(location.search);
const mode = params.get('mode') || 'farm';
if (mode === 'thumbs') {
  const box = document.getElementById('thumbs');
  box.style.display = 'flex';
  for (const c of CROPS) for (let v = 0; v < c.variants; v++) {
    const f = document.createElement('figure');
    f.append(cropImg(c.id, v), document.createTextNode(`${c.id}:${v}`));
    box.append(f);
  }
} else {
  const scene = new FarmScene(document.getElementById('c'), { onPlot: (i) => console.log('plot', i), onAction: (a) => console.log(a), quality: params.get('q') || 'high' });
  const page = Number(params.get('page') || 0);
  const list = CROPS.slice(page * 16, page * 16 + 16);
  const variant = Number(params.get('v') || 0);
  for (let i = 0; i < 16; i++) {
    const c = list[i];
    if (!c) { scene.setPlot(i, null, { animate: false }); continue; }
    const stage = params.get('stage') ? Number(params.get('stage')) : 3;
    scene.setPlot(i, { crop: c.id, stage, variant: Math.min(variant, c.variants - 1), mystery: false }, { animate: false });
  }
  if (params.get('locked')) for (const i of [0, 3, 12, 15]) scene.setPlot(i, { locked: true }, { animate: false });
  window.__ready = true;
}
</script>
</body></html>

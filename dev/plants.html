<!doctype html>
<html>
<head><meta charset="utf-8"><title>Plants</title>
<!-- The game fetches its pictures from beside index.html (Vite still resolves the imports below from this file). -->
<base href="../">
<style>
  html,body{margin:0;background:#2b2b2b;font-family:sans-serif;color:#eee}
  main{display:flex;flex-wrap:wrap;gap:8px;padding:8px}
  figure{margin:0;position:relative}
  figcaption{position:absolute;left:6px;top:4px;font-size:12px;text-shadow:0 1px 2px #000;z-index:3}
  canvas{display:block}
  .over{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:2}
  label{display:flex;gap:6px;align-items:center;font-size:13px;padding:0 8px}
  #c{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:1}
</style></head>
<body>
<!-- The plants of step 2 of the redesign, one kind at a time (?set=pines): for each place the reference design draws
     one, the reference cut round it beside the model at the same scale, in the game's light and from its camera (the
     slider lays the reference over the model); then a few of the model close up, from other seeds
     (?seeds=1,2,3,4, ?h=1.4 their height, ?close for their trunks and where they fork); ?set=round for the round trees (?leaves=green, the darker ones), ?set=fruit the fruit trees (?fruit=orange), ?set=blossom the pink blossom tree, ?set=birch the birches, ?set=slim the slim upright trees by the river, ?set=fir the full light green fir on the upper riverbank, ?set=bushes the bushes, ?set=sunflowers the sunflowers, ?set=tomatoes the tomato plants, ?set=post the post with a robin on it by the fields' back fence, ?set=daisies the white daisies (flowers.js), ?set=pinks the row of tall pink flowers along the ring road, ?set=yellow the yellow clumps, ?set=purple the purple ones, ?set=orange and ?set=lupins the spikes by the well, ?set=beds the mixed beds. -->
<div id="refs"></div>
<label>Chồng thiết kế lên <input id="mix" type="range" min="0" max="1" step="0.05" value="0"></label>
<main id="seeds"></main>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { SUN_DIR } from '../src/three/countryside.js';
import { pine } from '../src/three/plants/pine.js';
import { roundTree, ROUND_TREES } from '../src/three/plants/roundTree.js';
import { fruitTree, FRUIT_TREES } from '../src/three/plants/fruitTree.js';
import { blossomTree } from '../src/three/plants/blossomTree.js';
import { birch } from '../src/three/plants/birch.js';
import { slimTree } from '../src/three/plants/slimTree.js';
import { fir } from '../src/three/plants/fir.js';
import { bush } from '../src/three/plants/bush.js';
import { sunflower } from '../src/three/plants/sunflower.js';
import { tomato, tomatoRow } from '../src/three/plants/tomato.js';
import { birdPost } from '../src/three/buildings/birdPost.js';
import { flowers, flowerRow, flowerBed } from '../src/three/plants/flowers.js';

// The reference design (art/backdrop/2-style-reference.png) and how many of its pixels a world unit takes across the
// screen and up it (REF in dev/buildings.html).
const REF = { url: './art/backdrop/2-style-reference.png', scale: 55, scaleY: 59 };
const CAM_DIR = new THREE.Vector3(1, 0.95, 1).normalize(); // as in FarmScene

// Each set: how to make one (seed, height), and where the reference draws them: the box cut from it, the pixel its
// foot stands on (guessed where it is hidden, from where its top is and the height given) and how tall it is.
const SETS = {
  pines: {
    make: (seed, h) => pine(seed, h),
    h: 1.4,
    refs: [
      { name: 'Thông nhỏ cạnh đồng cỏ', box: [165, 700, 235, 795], foot: [199, 789], height: 1.39, seed: 1 },
      { name: 'Thông lớn phía trước (gốc bị che)', box: [495, 725, 645, 905], foot: [569, 902], height: 3.4, seed: 2 },
    ],
  },
  round: {
    // ?leaves=green for the darker green ones (ROUND_TREES).
    make: (seed, h) => roundTree(seed, h, ROUND_TREES[params.get('leaves') || 'lime']),
    h: 2.4,
    refs: [
      { name: 'Cây tán tròn trong rừng bên trái', box: [15, 275, 135, 415], foot: [73, 412], height: 2.5, seed: 1 },
      { name: 'Cây tán tròn trong rừng phía sau (gốc bị che)', box: [535, 100, 670, 250], foot: [604, 247], height: 2.4, seed: 2 },
    ],
  },
  fruit: {
    // ?fruit=orange for the orange trees (FRUIT_TREES).
    make: (seed, h) => fruitTree(seed, h, FRUIT_TREES[params.get('fruit') || 'apple']),
    h: 1.6,
    refs: [
      { name: 'Cây ăn quả trong vòng đường, bên trái', box: [525, 545, 615, 645], foot: [571, 636], height: 1.6, seed: 1 },
      { name: 'Cây ăn quả trong vòng đường, bên phải', box: [960, 350, 1060, 450], foot: [1009, 446], height: 1.6, seed: 2 },
    ],
  },
  blossom: {
    make: (seed, h) => blossomTree(seed, h),
    h: 1.9,
    refs: [{ name: 'Cây anh đào hồng cạnh nhà', box: [295, 315, 410, 440], foot: [355, 428], height: 1.9, seed: 1 }],
  },
  birch: {
    make: (seed, h) => birch(seed, h),
    h: 2.4,
    refs: [
      { name: 'Bạch dương bên sông, phía trước bên trái', box: [200, 635, 315, 795], foot: [256, 788], height: 2.4, seed: 1 },
      { name: 'Bạch dương cạnh ruộng, bên phải', box: [1510, 445, 1644, 612], foot: [1575, 603], height: 2.5, seed: 2 },
    ],
  },
  slim: {
    make: (seed, h) => slimTree(seed, h),
    h: 2.1,
    refs: [
      { name: 'Cây mảnh bên sông, cạnh hàng rào ruộng (cây trước, gốc bị che)', box: [1335, 525, 1410, 660], foot: [1371, 650], height: 2.3, seed: 1 },
      { name: 'Cây mảnh bên sông, cạnh hàng rào ruộng (cây sau)', box: [1360, 535, 1430, 650], foot: [1393, 640], height: 1.85, seed: 2 },
    ],
  },
  fir: {
    make: (seed, h) => fir(seed, h),
    h: 1.6,
    refs: [{ name: 'Cây linh sam xanh nhạt bên sông, phía trên', box: [1325, 360, 1425, 470], foot: [1371, 455], height: 1.6, seed: 1 }],
  },
  bushes: {
    make: (seed, h) => bush(seed, h),
    h: 0.4,
    // Close up, framed wider than tall and lower (the trees are framed by their height, from just under their foot).
    span: 2,
    low: 0.6,
    refs: [
      { name: 'Bụi cây sau chuồng gà, cạnh gốc cây', box: [672, 180, 727, 228], foot: [698, 211], height: 0.35, seed: 1 },
      { name: 'Bụi cây dưới gốc cây mảnh, sau hàng rào ruộng', box: [1342, 605, 1397, 660], foot: [1370, 643], height: 0.4, seed: 2 },
    ],
  },
  sunflowers: {
    make: (seed, h) => sunflower(seed, h),
    h: 1.4,
    refs: [
      { name: 'Hướng dương phía trước bên phải ruộng', box: [1545, 745, 1615, 870], foot: [1580, 858], height: 1.65, seed: 1 },
      { name: 'Hướng dương cạnh hàng rào sau ruộng (gốc bị che)', box: [1588, 625, 1636, 700], foot: [1610, 694], height: 1.1, seed: 2 },
    ],
  },
  tomatoes: {
    make: (seed, h) => tomato(seed, h),
    h: 0.65,
    span: 1.6,
    low: 0.3,
    refs: [
      {
        name: 'Luống cà chua cạnh con heo, sau các ô đất',
        box: [760, 300, 890, 390],
        foot: [828, 366],
        height: 0.65,
        seed: 1,
        // A row of them two units long, running along the ring road there.
        make: (seed, h) => {
          const row = tomatoRow(seed, 2, h);
          row.rotation.y = Math.atan2(0.45, 0.89);
          return row;
        },
      },
    ],
  },
  post: {
    make: (seed, h) => birdPost(seed, h),
    h: 1.13,
    refs: [
      { name: 'Cột có chim đậu cạnh hàng rào sau ruộng, cạnh bù nhìn (gốc bị che)', box: [1470, 570, 1540, 650], foot: [1502, 640], height: 1.13, seed: 1 },
      { name: 'Cùng chỗ đó, nhìn rộng hơn', box: [1440, 545, 1580, 680], foot: [1502, 640], height: 1.13, seed: 1 },
    ],
  },
  daisies: {
    make: (seed, h) => flowers(seed, h, 'daisy'),
    h: 0.7,
    span: 1.6,
    low: 0.3,
    refs: [{ name: 'Khóm cúc trắng bên sông, phía trước bên trái', box: [330, 700, 425, 780], foot: [378, 765], height: 0.7, seed: 1 }],
  },
  pinks: {
    // Close up, a short row of three.
    make: (seed, h) => flowerRow(seed, 0.6, h, 'pink'),
    h: 0.3,
    span: 2.6,
    low: 0.4,
    refs: [
      {
        name: 'Hàng hoa hồng thân cao dọc vòng đường, cạnh các ô đất',
        box: [550, 505, 690, 615],
        foot: [616, 574],
        height: 0.3,
        seed: 1,
        // About three units long, running along the ring road there.
        make: (seed, h) => {
          const row = flowerRow(seed, 3, h, 'pink');
          row.rotation.y = 0.15;
          return row;
        },
      },
    ],
  },
  yellow: {
    make: (seed, h) => flowers(seed, h, 'yellow'),
    h: 0.5,
    span: 1.6,
    low: 0.3,
    refs: [
      { name: 'Khóm hoa vàng phía trước, bên trái giếng', box: [515, 670, 605, 745], foot: [548, 735], height: 0.5, seed: 1 },
      { name: 'Khóm hoa vàng ở mép trái', box: [0, 645, 70, 705], foot: [30, 695], height: 0.5, seed: 2 },
    ],
  },
  purple: {
    make: (seed, h) => flowers(seed, h, 'purple'),
    h: 0.35,
    span: 1.6,
    low: 0.3,
    refs: [{ name: 'Khóm hoa tím cạnh tảng đá bên sông, bên phải', box: [1280, 455, 1360, 515], foot: [1335, 497], height: 0.35, seed: 1 }],
  },
  orange: {
    make: (seed, h) => flowers(seed, h, 'orange'),
    h: 0.6,
    refs: [{ name: 'Ngọn hoa cam bên trái giếng', box: [355, 615, 420, 672], foot: [389, 663], height: 0.6, seed: 1 }],
  },
  lupins: {
    make: (seed, h) => flowers(seed, h, 'lupin'),
    h: 0.55,
    span: 1.3,
    low: 0.2,
    refs: [{ name: 'Ngọn hoa tím cạnh ghế, bên phải giếng', box: [655, 650, 725, 715], foot: [674, 700], height: 0.55, seed: 1 }],
  },
  beds: {
    // Close up, a short straight bed.
    make: (seed, h) => flowerBed(seed, [[-0.4, 0], [0.4, 0]], h),
    h: 0.3,
    span: 3,
    low: 1,
    refs: [
      // Curving round the front of the well, from its left to its right (measured on the reference).
      { name: 'Luống hoa trộn trước giếng', box: [415, 635, 505, 695], foot: [462, 680], height: 0.3, seed: 1, make: (seed, h) => flowerBed(seed, [[-0.71, -0.07], [-0.3, 0.02], [0, 0], [0.08, -0.59]], h) },
      // Along the fence by the road below the farmhouse.
      { name: 'Luống hoa trộn dọc hàng rào cạnh nhà', box: [350, 400, 455, 465], foot: [405, 440], height: 0.3, seed: 2, make: (seed, h) => flowerBed(seed, [[-0.61, 0.29], [0.61, -0.29]], h) },
    ],
  },
};
const params = new URLSearchParams(location.search);
const set = SETS[params.get('set') || 'pines'];
const seeds = (params.get('seeds') || '1,2,3,4').split(',').map(Number);
const seedHeight = Number(params.get('h') || set.h);

const refImg = new Image();
refImg.src = REF.url;
await refImg.decode();

// A view: a cell on the page, the tree in it, and how many world units the cell shows each way from its foot.
const views = [];
const figure = (parent, caption, w, h) => {
  const f = document.createElement('figure');
  f.style.width = `${w}px`;
  f.style.height = `${h}px`;
  const cap = document.createElement('figcaption');
  cap.textContent = caption;
  f.append(cap);
  parent.append(f);
  return f;
};
const drawRef = (canvas, [x0, y0, x1, y1], w, h) => {
  canvas.width = w * devicePixelRatio;
  canvas.height = h * devicePixelRatio;
  canvas.style.width = `${w}px`;
  canvas.style.height = `${h}px`;
  const g = canvas.getContext('2d');
  g.imageSmoothingQuality = 'high';
  g.drawImage(refImg, x0, y0, x1 - x0, y1 - y0, 0, 0, canvas.width, canvas.height);
};
// Each comparison takes a row: the reference and the model side by side, half the page wide each, or as wide as fits
// the window's height.
const half = Math.floor((window.innerWidth - 24) / 2);
for (const place of set.refs) {
  const { name, box, foot, height, seed } = place;
  const [x0, y0, x1, y1] = box;
  const zoom = Math.min(half / (x1 - x0), (window.innerHeight * 0.85) / (y1 - y0));
  const w = Math.round((x1 - x0) * zoom);
  const h = Math.round((y1 - y0) * zoom);
  const refs = document.createElement('main');
  document.getElementById('refs').append(refs);
  const a = figure(refs, name, w, h);
  const ref = document.createElement('canvas');
  drawRef(ref, box, w, h);
  a.append(ref);
  const b = figure(refs, `Mẫu (${height} cao)`, w, h);
  const over = document.createElement('canvas');
  over.className = 'over';
  drawRef(over, box, w, h);
  b.append(over);
  views.push({ f: b, tree: (place.make ?? set.make)(seed, height), left: -(foot[0] - x0) / REF.scale, right: (x1 - foot[0]) / REF.scale, top: (foot[1] - y0) / REF.scaleY, bottom: -(y1 - foot[1]) / REF.scaleY });
}
document.getElementById('mix').addEventListener('input', (e) => document.querySelectorAll('.over').forEach((c) => (c.style.opacity = e.target.value)));
for (const seed of seeds) {
  const ch = Math.min(Math.round(half * 1.25), Math.round(window.innerHeight * 0.85));
  const f = figure(document.getElementById('seeds'), `seed ${seed}`, half, ch);
  const span = params.has('close') ? 0.5 : set.span ?? 1.05;
  const w = (seedHeight * span * half) / ch;
  const low = params.has('close') ? 0.1 : set.low ?? 0.1;
  views.push({ f, tree: set.make(seed, seedHeight), left: -w / 2, right: w / 2, top: seedHeight * (span - low), bottom: -seedHeight * low });
}

// The game's renderer settings and lights (see FarmScene and dev/buildings.html), on a plain grassy ground.
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.setScissorTest(true);
renderer.setClearColor('#cfe9f7', 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight('#e4eeff', '#7b9a4a', 0.8));
const sun = new THREE.DirectionalLight('#ffe2a4', 3.2);
sun.position.copy(SUN_DIR).multiplyScalar(10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 25 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#86c94f', roughness: 0.95 }));
ground.receiveShadow = true;
scene.add(ground);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
camera.position.copy(CAM_DIR).multiplyScalar(30);
camera.lookAt(0, 0, 0);

renderer.setAnimationLoop(() => {
  if (renderer.getPixelRatio() !== devicePixelRatio) renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  for (const { f, tree, left, right, top, bottom } of views) {
    const r = f.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) continue;
    Object.assign(camera, { left, right, top, bottom });
    camera.updateProjectionMatrix();
    scene.add(tree);
    const y = window.innerHeight - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height);
    renderer.setScissor(r.left, y, r.width, r.height);
    renderer.render(scene, camera);
    scene.remove(tree);
  }
  window.__ready = true;
});
</script>
</body></html>
